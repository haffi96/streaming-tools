[project]
name = "streaming-tools"
version = "0.1.0"
description = "Network video/data streaming tools"
requires-python = ">=3.10"
dependencies = [
    "gstreamer-source",
    "pygobject>=3.48.2",
]

[tool.uv.sources]
gstreamer-source = { workspace = true }

[tool.uv.workspace]
members = ["tools/*", "apps/livekit_tester/"]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]
