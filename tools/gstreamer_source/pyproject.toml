[project]
name = "gstreamer-source"
version = "0.2.0"
description = "Cross-platform GStreamer camera/test source: H.264 (byte-stream or avc) or NV12 over TCP or file, with SEI timestamp metadata."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygobject<3.50",
]

[project.scripts]
gstreamer-source = "gstreamer_source.cli:main"
parse-h264 = "gstreamer_source.parse:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gstreamer_source"]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]

[tool.ruff.lint]
# E402: Module level import not at top of file
# Required for GStreamer: gi.require_version() must come before gi.repository imports
ignore = ["E402"]
